name: Pipeline Diario PcComponentes

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch: 

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar el código del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Instalar librerías desde requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar el Pipeline con los Secrets de la nube
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        PYTHONUNBUFFERED: "1"
      run: python main.py